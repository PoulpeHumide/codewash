name: CI

# Quality gate for every pull request (and for main after merge).
# Any failing step turns the check red; branch protection on main must
# require the "quality-gate" job so that nothing is merged on red.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CodeWashGame

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      # The Electron binary is only needed to package the desktop app.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CodeWashGame/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint static analysis)
        run: npm run lint

      - name: Tests with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Complexity report (informational)
        run: npm run metrics:complexity

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;
            const row=k=>'| '+k+' | '+t[k].pct+' % | '+t[k].covered+'/'+t[k].total+' |';
            console.log(['## Coverage','| Metric | % | Covered |','|---|---|---|',
            ...['lines','statements','functions','branches'].map(row)].join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: CodeWashGame/coverage
          if-no-files-found: ignore
